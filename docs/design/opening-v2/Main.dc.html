<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    a { color: #30D158; } a:hover { color: #6BE28A; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #000000; color: #FFFFFF; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; background: #0E0E10; display: flex; align-items: center; justify-content: center;">
    <div style="position: absolute; inset: 16px; border: 1.5px dashed rgba(235,235,245,0.20); border-radius: 18px;"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0.5;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <div style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: rgba(235,235,245,0.45); letter-spacing: 0.4px;">LIVE PREVIEW</div>
    </div>
  </div>

  <div style="position: absolute; top: 59px; left: 16px; right: 16px; display: flex; align-items: flex-start; gap: 10px;">

    <div style="flex-grow: 1; background: rgba(28,28,30,0.86); border-radius: 14px; padding: 11px 14px; display: flex; align-items: center; gap: 11px; min-height: 44px; box-sizing: border-box;">
      <div style="width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: {{chip.dot}};"></div>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
        <div style="font-size: 15px; font-weight: 600; line-height: 1.2;">{{chip.title}}</div>
        <div style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.3; color: rgba(235,235,245,0.6);">{{chip.detail}}</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(235,235,245,0.45)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="m9 18 6-6-6-6"/></svg>
    </div>

    <div style="background: rgba(28,28,30,0.86); border-radius: 14px; padding: 11px 14px; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 44px; box-sizing: border-box;">
      <div style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; font-weight: 600; line-height: 1.2;">41</div>
      <div style="font-size: 11px; color: rgba(235,235,245,0.6); line-height: 1.2;">shots</div>
    </div>

  </div>

  <sc-if value="{{chip.hasNote}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; top: 125px; left: 16px; right: 16px; background: rgba(28,28,30,0.86); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;">
      <div style="width: 3px; align-self: stretch; border-radius: 2px; flex-shrink: 0; background: {{chip.dot}};"></div>
      <div style="font-size: 13px; line-height: 1.4; color: rgba(235,235,245,0.6);">{{chip.note}}</div>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 34px 20px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(to top, rgba(0,0,0,0.92) 55%, rgba(0,0,0,0));">

    <div style="display: flex; gap: 18px; align-items: baseline;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 11px; color: rgba(235,235,245,0.45);">Capture</div>
        <div style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600;">1080p · 150 fps</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 11px; color: rgba(235,235,245,0.45);">Kept per shot</div>
        <div style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600;">3.0 s</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 11px; color: rgba(235,235,245,0.45);">Room for</div>
        <div style="font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; font-weight: 600;">40 sessions</div>
      </div>
    </div>

    <div style="background: #30D158; color: #000000; border-radius: 14px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">Arm</div>

    <div style="text-align: center; font-size: 13px; color: rgba(235,235,245,0.45);">{{chip.armNote}}</div>

  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"hostState":{"editor":"enum","options":["looking","connected","nothing","unreachable"],"default":"looking","section":"State"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const states = {
      looking: {
        dot: '#5AA9FF',
        title: 'Looking for Bay 3',
        detail: 'browsing · 6s',
        hasNote: false,
        note: '',
        armNote: 'Arming does not wait for Studio.'
      },
      connected: {
        dot: '#30D158',
        title: 'Bay 3 — Mac Studio',
        detail: 'offset −3.184 ms · drift 18 ppm',
        hasNote: false,
        note: '',
        armNote: 'Every shot reaches Studio as you hit it.'
      },
      nothing: {
        dot: 'rgba(235,235,245,0.45)',
        title: 'On your own',
        detail: 'no Studio remembered',
        hasNote: true,
        note: 'Everything is kept here. Connect a Studio whenever you like — one that turns up mid-session is picked up on its own.',
        armNote: 'Send to Studio later, from the session library.'
      },
      unreachable: {
        dot: '#FF9F0A',
        title: 'Bay 3 has not appeared',
        detail: 'looked for 45s · still looking',
        hasNote: true,
        note: 'Either Studio is not running, or this network does not carry discovery between its devices. A pairing code always works.',
        armNote: 'Capture is unaffected. Shots wait here until it turns up.'
      }
    };
    const key = this.props.hostState ?? 'looking';
    return { chip: states[key] ?? states.looking };
  }
}
</script>
</body>
</html>
